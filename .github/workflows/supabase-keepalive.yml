# Garde le projet Supabase "bahula-dico" actif (évite la pause du plan gratuit)

name: Supabase keep-alive

on:
  schedule:
    - cron: "0 8 * * 1,4"   # lundi et jeudi à 8h GMT
  workflow_dispatch:        # bouton pour le lancer à la main

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Empêcher GitHub de désactiver ce workflow
        uses: gautamkrishnar/keepalive-workflow@v2

      - name: Requête légère sur la base
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TABLE: mots   # remplace par le nom réel de ta table de mots
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/$TABLE?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Réponse Supabase : $code"
          [ "$code" = "200" ] || exit 1
